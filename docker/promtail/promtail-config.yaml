server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.0.5:3100/loki/api/v1/push
    batchsize: 512000
    batchwait: 2s
    timeout: 10s
    backoff_config:
      min_period: 5s
      max_period: 5m
      max_retries: 500

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: logs
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
    - json:
        expressions:
          log: log
          stream: stream
          time: time
          tag: attrs.tag
          # docker compose
          compose_project: attrs."com.docker.compose.project"
          compose_service: attrs."com.docker.compose.service"
    - regex:
        expression: "^/var/lib/docker/containers/(?P<container_id>.{12}).+/.+-json.log$"
        source: filename
    - timestamp:
        format: RFC3339Nano
        source: time
    - labels:
        stream:
        tag:
        # docker compose
        compose_project:
        compose_service:
    - output:
        source: log
