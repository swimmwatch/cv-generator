services:
  bot:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  worker-beat:
    depends_on:
      cache:
        condition: service_healthy

  worker:
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      worker-beat:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    hostname: minio
    restart: always
    profiles:
      - "development"
      - "main"
    command: minio server --console-address ":9090" /data
    env_file: .env
    ports:
      - "${MINIO_PUBLIC_UI_PORT}:9090" # web ui
      - "${MINIO_PUBLIC_PORT}:9000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_volume:/data

  cache:
    image: "redis:8.4.0-alpine"
    restart: unless-stopped
    profiles:
      - "development"
      - "main"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    volumes:
      - cache_volume:/data

  db:
    image: "postgres:17.7-alpine"
    restart: unless-stopped
    profiles:
      - "development"
      - "main"
    env_file: .env
    volumes:
      - db_volume:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.5
    restart: unless-stopped
    profiles:
      - "development"
      - "main"
    ports:
      - "${WEAVIATE_PUBLIC_HTTP_PORT:-8081}:8080"
      - "${WEAVIATE_PUBLIC_GRPC_PORT:-50051}:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      ENABLE_MODULES: text2vec-openai
      CLUSTER_HOSTNAME: "node1"
      OPENAI_APIKEY: ${OPENAI_API_KEY}
    volumes:
      - weaviate_volume:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright-mcp:
    build:
      context: docker/playwright-mcp
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    profiles:
      - "development"
      - "main"
    environment:
      DEBUG: "pw:mcp*"
    healthcheck:
      test: ["CMD", "node", "/config/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp-proxy:
    build:
      context: docker
      dockerfile: mcp-proxy/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    profiles:
      - "development"
      - "main"
    env_file: .env

volumes:
  db_volume:
  cache_volume:
  minio_volume:
  weaviate_volume:
