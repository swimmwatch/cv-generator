[project]
name = "cv-generator-bot"
version = "1.0.0"
description = "CV Generator Bot - A Telegram bot that generates CVs based on user input and AI capabilities."
authors = [
    {name = "Dmitry Vasiliev", email = "contact.vasiliev.dmitry@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncclick>=8.3.0.7",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "click>=8.3.1",
    "dependency-injector[pydantic2]>=4.48.3",
    "emoji>=2.15.0",
    "faker>=40.4.0",
    "fakeredis>=2.34.0",
    "fastapi>=0.129.1",
    "gunicorn>=25.1.0",

    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.0.9",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.62.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "aiogram>=3.22.0",
    "pytz>=2025.2",
    "redis>=7.2.0",
    "sqlalchemy>=2.0.46",
    "sqlalchemy-utils>=0.42.1",
    "structlog>=25.5.0",
    "taskiq>=0.12.1",
    "taskiq-pipelines>=0.1.4",
    "taskiq-redis>=1.2.2",
    "telegram-webapp-auth>=3.0.7",
    "uvicorn>=0.41.0",
    "yt-dlp>=2026.2.21",
    "aioboto3>=7.0.0",
    "aiofiles>=25.1.0",
    "weaviate-client>=4.20.3",
    "logfire>=4.25.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "flake8-bandit>=4.1.1",
    "flake8-bugbear>=25.11.29",
    "flake8-comprehensions>=3.17.0",
    "flake8-expression-complexity>=0.0.11",
    "flake8-isort>=7.0.0",
    "flake8-pyproject>=1.2.4",
    "flake8-pytest-style>=2.2.0",
    "flake8-quotes>=3.4.0",
    "flake8-rst-docstrings>=0.4.0",
    "flake8-string-format>=0.3.0",
    "flake8-use-fstring>=1.4",
    "flake8-use-pathlib>=0.3.0",
    "flake8-useless-assert>=0.4.4",
    "flake8-walrus>=1.2.0",
    "isort>=8.0.0",
    "mypy>=1.19.1",
    "pep8-naming>=0.15.1",
    "polyfactory>=2.22.2",
    "pytest>=9.0.2",
    "pytest-alembic>=0.12.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=16.1",
    "pytest-xdist>=3.8.0",
    "types-aiobotocore>=3.2.1",
    "types-aiobotocore-s3>=3.2.1",
    "types-aiofiles>=25.1.0.20251011",
    "types-pytz>=2025.2.0.20251108",
    "types-redis>=4.6.0.20241004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[project.scripts]
manage = "cli.main:cli"

[tool.isort]
profile = "black"
force_single_line = true
